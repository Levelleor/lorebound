name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      application: ${{ steps.changes.outputs.application }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check documentation links and generated-file policy
        run: python3 scripts/check_repository.py
      - name: Check shell script syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Determine whether application checks are needed
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          application=false
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            application=true
          else
            git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/lorebound-changed-files"
            while IFS= read -r -d '' file; do
              case "$file" in
                frontend/*|internal/*|scripts/*|.github/*) application=true ;;
                planning/*|docs/*|*.md|.gitignore) ;;
                *) application=true ;;
              esac
            done < "$RUNNER_TEMP/lorebound-changed-files"
          fi
          echo "application=$application" >> "$GITHUB_OUTPUT"
  headless:
    name: Headless host and browser
    needs: repository
    if: needs.repository.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      LOREBOUND_ARTIFACT_DIR: /tmp/lorebound-artifacts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Show environment
        run: |
          mkdir -p "$LOREBOUND_ARTIFACT_DIR"
          uname -a
          go version
          node --version
          npm --version
      - name: Install, typecheck and build the real host
        run: bash scripts/build.sh
      - name: TypeScript library contracts
        run: npm --prefix frontend run test:unit
      - name: Static Go checks
        run: go vet -tags server ./...
      - name: Real SQLite contract and recovery tests
        run: go test -count=1 -tags server -v ./...
      - name: Install Firefox and system dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps firefox
      - name: Real browser, host restrictions and restart persistence
        timeout-minutes: 3
        run: bash scripts/verify-host.sh
      - name: Retain browser captures and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ env.LOREBOUND_ARTIFACT_DIR }}/*.png
            ${{ env.LOREBOUND_ARTIFACT_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 7
